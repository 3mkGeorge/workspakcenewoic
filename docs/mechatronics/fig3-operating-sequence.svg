<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 630" width="1280" height="630" role="img" aria-label="State flow: Idle, then on start the level is checked. If low, Fault. If OK, Feed opens the valve for t_fill, then Stroke up until LS1 and Stroke down until LS2. If N cycles are not done the controller loops back to Feed; when done it goes to Stop and returns to Idle." font-family="Helvetica, Arial, sans-serif">
<title>Fig. 3 – Operating sequence</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d2452f"/></marker></defs>
<rect width="1280" height="630" fill="#ffffff"/>
<rect x="12" y="12" width="1256" height="606" fill="none" stroke="#1d2733" stroke-width="1.5"/>
<text x="40" y="54" font-size="24" fill="#1d2733" font-weight="700">Operating Sequence</text>
<text x="40" y="78" font-size="13" fill="#5b6876">Fig. 3 — What the controller does for one run, from idle back to idle.</text>
<rect x="58" y="230" width="136" height="80" rx="8" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="126" y="258" font-size="14" fill="#1d2733" font-weight="700" text-anchor="middle">Idle</text>
<text x="126" y="278" font-size="11.5" fill="#5b6876" text-anchor="middle">V1 closed · M1 off</text>
<text x="126" y="294" font-size="11.5" fill="#5b6876" text-anchor="middle">LED green</text>
<polygon points="236,270.0 294,220.0 352,270.0 294,320.0" fill="#ffffff" stroke="#1d2733" stroke-width="1.8" stroke-linejoin="round"/>
<text x="294" y="275.0" font-size="12.5" fill="#1d2733" font-weight="700" text-anchor="middle">Level OK?</text>
<rect x="394" y="230" width="136" height="80" rx="8" fill="#d9eaf7" stroke="#2a77b5" stroke-width="1.8"/>
<text x="462" y="258" font-size="14" fill="#1d2733" font-weight="700" text-anchor="middle">Feed</text>
<text x="462" y="278" font-size="11.5" fill="#5b6876" text-anchor="middle">open V1 for t_fill</text>
<text x="462" y="294" font-size="11.5" fill="#5b6876" text-anchor="middle">then close V1</text>
<rect x="572" y="230" width="136" height="80" rx="8" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="648" y="258" font-size="14" fill="#1d2733" font-weight="700" text-anchor="middle">Stroke up</text>
<text x="648" y="278" font-size="11.5" fill="#5b6876" text-anchor="middle">M1 DIR = up</text>
<text x="648" y="294" font-size="11.5" fill="#5b6876" text-anchor="middle">until LS1 trips</text>
<rect x="750" y="230" width="136" height="80" rx="8" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="826" y="258" font-size="14" fill="#1d2733" font-weight="700" text-anchor="middle">Stroke down</text>
<text x="826" y="278" font-size="11.5" fill="#5b6876" text-anchor="middle">M1 DIR = down</text>
<text x="826" y="294" font-size="11.5" fill="#5b6876" text-anchor="middle">until LS2 trips</text>
<polygon points="928,270.0 986,220.0 1044,270.0 986,320.0" fill="#ffffff" stroke="#1d2733" stroke-width="1.8" stroke-linejoin="round"/>
<text x="986" y="268.0" font-size="12.5" fill="#1d2733" font-weight="700" text-anchor="middle">N cycles</text>
<text x="986" y="284.0" font-size="12.5" fill="#1d2733" font-weight="700" text-anchor="middle">done?</text>
<rect x="1086" y="230" width="136" height="80" rx="8" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="1154" y="258" font-size="14" fill="#1d2733" font-weight="700" text-anchor="middle">Stop</text>
<text x="1154" y="278" font-size="11.5" fill="#5b6876" text-anchor="middle">M1 off · V1 closed</text>
<text x="1154" y="294" font-size="11.5" fill="#5b6876" text-anchor="middle">reset counter</text>
<line x1="588" y1="288.0" x2="588" y2="254.0" stroke="#d2452f" stroke-width="2.6" marker-end="url(#ah-red)"/>
<line x1="766" y1="252.0" x2="766" y2="286.0" stroke="#d2452f" stroke-width="2.6" marker-end="url(#ah-red)"/>
<rect x="226" y="420" width="136" height="70" rx="8" fill="#fdeceb" stroke="#b42318" stroke-width="1.8"/>
<text x="294" y="446" font-size="14" fill="#b42318" font-weight="700" text-anchor="middle">Fault</text>
<text x="294" y="464" font-size="11.5" fill="#5b6876" text-anchor="middle">all outputs off</text>
<text x="294" y="480" font-size="11.5" fill="#5b6876" text-anchor="middle">LED red</text>
<line x1="194" y1="270.0" x2="234" y2="270.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="214.0" y="260.0" font-size="11" fill="#1d2733" text-anchor="middle">start</text>
<line x1="352" y1="270.0" x2="392" y2="270.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="372.0" y="260.0" font-size="11" fill="#1d2733" text-anchor="middle">yes</text>
<line x1="530" y1="270.0" x2="570" y2="270.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="708" y1="270.0" x2="748" y2="270.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="886" y1="270.0" x2="926" y2="270.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="1044" y1="270.0" x2="1084" y2="270.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1064.0" y="260.0" font-size="11" fill="#1d2733" text-anchor="middle">yes</text>
<path d="M986 320.0 V380 H462 V312" fill="none" stroke="#1d2733" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="724" y="372" font-size="11" fill="#1d2733" text-anchor="middle">no · next cycle</text>
<line x1="294" y1="320.0" x2="294" y2="418" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="304" y="376" font-size="11" fill="#b42318">no</text>
<path d="M226 455 H126 V312" fill="none" stroke="#1d2733" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="136" y="446" font-size="11" fill="#1d2733">SW1 reset</text>
<path d="M1154 230 V160 H126 V228" fill="none" stroke="#1d2733" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="640" y="152" font-size="11" fill="#1d2733" text-anchor="middle">run complete → back to idle</text>
<text x="40" y="528" font-size="12" fill="#5b6876">In any state: pressing SW1 goes to Stop; the level sensor reading low goes to Fault.</text>
<text x="40" y="548" font-size="12" fill="#5b6876">t_fill, N and the stroke speed (pot on A0) are set in the firmware.</text>
<rect x="960" y="520" width="296" height="84" fill="#ffffff" stroke="#1d2733" stroke-width="1.2"/>
<line x1="960" y1="548" x2="1256" y2="548" stroke="#1d2733" stroke-width="0.8"/>
<line x1="960" y1="576" x2="1256" y2="576" stroke="#1d2733" stroke-width="0.8"/>
<text x="972" y="539" font-size="12" fill="#1d2733" font-weight="700" letter-spacing="0.6">MECHATRONICS PROJECT</text>
<text x="972" y="567" font-size="12" fill="#1d2733">Fig. 3 · Operating sequence</text>
<text x="1244" y="567" font-size="11" fill="#5b6876" text-anchor="end">NTS</text>
<text x="972" y="595" font-size="11" fill="#5b6876">Sheet 3 of 3 · Rev A · 2026-10-14</text>
</svg>
