<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-label="Block diagram: start/stop button, speed potentiometer, level sensor and two limit switches feed a microcontroller. The controller drives a valve driver that switches the 12 V solenoid valve, a motor driver that powers the gear motor, and a status LED. A 12 V supply powers the drivers and a 5 V regulator powers the controller. The motor turns a lead screw or belt that moves the sliding collar, which trips the limit switches at the stroke ends." font-family="Helvetica, Arial, sans-serif">
<title>Fig. 2 – Control block diagram</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a77b5"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d2452f"/></marker></defs>
<rect width="1280" height="840" fill="#ffffff"/>
<rect x="12" y="12" width="1256" height="816" fill="none" stroke="#1d2733" stroke-width="1.5"/>
<text x="40" y="54" font-size="24" fill="#1d2733" font-weight="700">Control System · Block Diagram</text>
<text x="40" y="78" font-size="13" fill="#5b6876">Fig. 2 — Signals and power between the sensors, the controller and the actuators. Numbers refer to Fig. 1.</text>
<text x="56" y="198" font-size="10.5" fill="#5b6876" font-weight="700" letter-spacing="1">INPUTS</text>
<text x="380" y="198" font-size="10.5" fill="#5b6876" font-weight="700" letter-spacing="1">CONTROLLER</text>
<text x="720" y="198" font-size="10.5" fill="#5b6876" font-weight="700" letter-spacing="1">DRIVERS</text>
<text x="1040" y="198" font-size="10.5" fill="#5b6876" font-weight="700" letter-spacing="1">ACTUATORS</text>
<text x="56" y="620" font-size="10.5" fill="#5b6876" font-weight="700" letter-spacing="1">MECHANISM  (parts from Fig. 1)</text>
<rect x="380" y="100" width="220" height="52" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="394" y="123.0" font-size="13.5" fill="#1d2733" font-weight="700">5 V regulator</text>
<text x="394" y="141.0" font-size="11.5" fill="#5b6876">buck converter, 12 V → 5 V</text>
<rect x="720" y="100" width="200" height="52" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="734" y="123.0" font-size="13.5" fill="#1d2733" font-weight="700">Power supply</text>
<text x="734" y="141.0" font-size="11.5" fill="#5b6876">12 V DC · 5 A adapter</text>
<rect x="1040" y="100" width="200" height="52" rx="6" fill="#d9eaf7" stroke="#2a77b5" stroke-width="1.8"/>
<text x="1054" y="123.0" font-size="13.5" fill="#1d2733" font-weight="700">Fluid path</text>
<text x="1054" y="141.0" font-size="11.5" fill="#5b6876">hose 5 → head 6 → column 7</text>
<rect x="56" y="210" width="230" height="60" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="70" y="237.0" font-size="13.5" fill="#1d2733" font-weight="700">Start / Stop button</text>
<text x="70" y="255.0" font-size="11.5" fill="#5b6876">SW1 · momentary, on base</text>
<rect x="56" y="300" width="230" height="60" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="70" y="327.0" font-size="13.5" fill="#1d2733" font-weight="700">Speed potentiometer</text>
<text x="70" y="345.0" font-size="11.5" fill="#5b6876">10 kΩ · sets stroke speed</text>
<rect x="56" y="390" width="230" height="60" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="70" y="417.0" font-size="13.5" fill="#1d2733" font-weight="700">Level sensor (3)</text>
<text x="70" y="435.0" font-size="11.5" fill="#5b6876">float switch in the tank</text>
<rect x="380" y="210" width="220" height="350" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="2.4"/>
<text x="394" y="236" font-size="14" fill="#1d2733" font-weight="700">Microcontroller</text>
<text x="394" y="255" font-size="11.5" fill="#5b6876">Arduino Uno / Nano</text>
<line x1="394" y1="268" x2="586" y2="268" stroke="#1d2733" stroke-width="0.8"/>
<text x="394" y="290" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D2  ← SW1 start / stop</text>
<text x="394" y="312" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">A0  ← speed pot</text>
<text x="394" y="334" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D3  ← level sensor</text>
<text x="394" y="356" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D4  ← LS1 top</text>
<text x="394" y="378" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D5  ← LS2 bottom</text>
<text x="394" y="400" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D8  → valve driver</text>
<text x="394" y="422" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D6  → motor PWM</text>
<text x="394" y="444" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D7  → motor DIR</text>
<text x="394" y="466" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D12 → LED green</text>
<text x="394" y="488" font-size="11.5" fill="#1d2733" font-family="Menlo, Consolas, 'Courier New', monospace">D13 → LED red</text>
<text x="394" y="538" font-size="11.5" fill="#5b6876">runs the sequence in Fig. 3</text>
<rect x="720" y="210" width="200" height="60" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="734" y="237.0" font-size="13.5" fill="#1d2733" font-weight="700">Valve driver</text>
<text x="734" y="255.0" font-size="11.5" fill="#5b6876">logic MOSFET + flyback diode</text>
<rect x="720" y="390" width="200" height="80" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="734" y="427.0" font-size="13.5" fill="#1d2733" font-weight="700">Motor driver</text>
<text x="734" y="445.0" font-size="11.5" fill="#5b6876">BTS7960 or L298N</text>
<rect x="720" y="500" width="200" height="54" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="734" y="524.0" font-size="13.5" fill="#1d2733" font-weight="700">Status LED</text>
<text x="734" y="542.0" font-size="11.5" fill="#5b6876">green = run · red = fault</text>
<rect x="1040" y="210" width="200" height="60" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="1054" y="237.0" font-size="13.5" fill="#1d2733" font-weight="700">Solenoid valve V1 (4)</text>
<text x="1054" y="255.0" font-size="11.5" fill="#5b6876">12 V, normally closed</text>
<rect x="1040" y="390" width="200" height="80" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="1054" y="427.0" font-size="13.5" fill="#1d2733" font-weight="700">Gear motor M1</text>
<text x="1054" y="445.0" font-size="11.5" fill="#5b6876">12 V DC · inside base (9)</text>
<rect x="1040" y="630" width="200" height="70" rx="6" fill="#fcebe6" stroke="#d2452f" stroke-width="1.8"/>
<text x="1054" y="662.0" font-size="13.5" fill="#1d2733" font-weight="700">Lead screw / belt</text>
<text x="1054" y="680.0" font-size="11.5" fill="#5b6876">turns rotation into lift</text>
<rect x="720" y="630" width="200" height="70" rx="6" fill="#fcebe6" stroke="#d2452f" stroke-width="1.8"/>
<text x="734" y="662.0" font-size="13.5" fill="#1d2733" font-weight="700">Sliding collar (8)</text>
<text x="734" y="680.0" font-size="11.5" fill="#5b6876">strokes up and down</text>
<rect x="380" y="630" width="220" height="70" rx="6" fill="#f6f8fa" stroke="#1d2733" stroke-width="1.8"/>
<text x="394" y="662.0" font-size="13.5" fill="#1d2733" font-weight="700">Limit switches</text>
<text x="394" y="680.0" font-size="11.5" fill="#5b6876">LS1 at top · LS2 at bottom</text>
<line x1="286" y1="240" x2="378" y2="240" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="333" y="232" font-size="11" fill="#1d2733" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace">D2</text>
<line x1="286" y1="330" x2="378" y2="330" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="333" y="322" font-size="11" fill="#1d2733" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace">A0</text>
<line x1="286" y1="420" x2="378" y2="420" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="333" y="412" font-size="11" fill="#1d2733" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace">D3</text>
<line x1="600" y1="240" x2="718" y2="240" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="660" y="232" font-size="11" fill="#1d2733" text-anchor="middle">D8 on/off</text>
<line x1="600" y1="430" x2="718" y2="430" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="660" y="422" font-size="11" fill="#1d2733" text-anchor="middle">D6 PWM</text>
<text x="660" y="448" font-size="11" fill="#1d2733" text-anchor="middle">D7 DIR</text>
<line x1="600" y1="527" x2="718" y2="527" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="660" y="519" font-size="11" fill="#1d2733" text-anchor="middle">D12 · D13</text>
<line x1="920" y1="240" x2="1038" y2="240" stroke="#b7791f" stroke-width="2.4" marker-end="url(#ah-amber)"/>
<text x="1002" y="262" font-size="11" fill="#b7791f" text-anchor="middle">switched 12 V</text>
<line x1="920" y1="430" x2="1038" y2="430" stroke="#b7791f" stroke-width="2.4" marker-end="url(#ah-amber)"/>
<text x="980" y="422" font-size="11" fill="#b7791f" text-anchor="middle">motor power</text>
<line x1="720" y1="126" x2="602" y2="126" stroke="#b7791f" stroke-width="2.4" marker-end="url(#ah-amber)"/>
<text x="661" y="118" font-size="11" fill="#b7791f" text-anchor="middle">12 V</text>
<line x1="490" y1="152" x2="490" y2="208" stroke="#b7791f" stroke-width="2.4" marker-end="url(#ah-amber)"/>
<text x="500" y="186" font-size="11" fill="#b7791f">5 V</text>
<line x1="820" y1="152" x2="820" y2="208" stroke="#b7791f" stroke-width="2.4" marker-end="url(#ah-amber)"/>
<text x="830" y="186" font-size="11" fill="#b7791f">12 V</text>
