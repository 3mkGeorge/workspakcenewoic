<text x="970" y="330" font-size="11" fill="#b7791f">12 V</text>
<line x1="1140" y1="210" x2="1140" y2="154" stroke="#2a77b5" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<text x="1150" y="186" font-size="11" fill="#2a77b5">fluid</text>
<line x1="1140" y1="470" x2="1140" y2="628" stroke="#d2452f" stroke-width="2.6" marker-end="url(#ah-red)"/>
<text x="1150" y="554" font-size="11" fill="#d2452f">rotation</text>
