{% set category_counts = category_counts|default({}) %}
<form class="panel filters" method="get" id="catalog-filters" data-partial-form="product-table"><div class="search-input"><i data-lucide="search"></i><input class="form-control" name="q" value="{{ request.args.get('q','') }}" placeholder="{{ 'بحث بالاسم أو الرمز أو الباركود...' if config.language=='ar' else 'Search by name, SKU, or barcode…' }}" aria-label='{{ t("Search products") }}'></div><div class="category-filter-wrap"><div class="category-select-row"><select class="form-select" name="category_id" id="category-filter-select" aria-label="Category"><option value="">{{ t('All Categories') }}</option><option value="" disabled>─────────────</option>{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if request.args.get('category_id')==c.id|string else '' }}>{{ c.name }} ({{ category_counts.get(c.id, 0) }})</option>{% endfor %}</select>{% if can("products.view") %}<button type="button" class="btn btn-light btn-sm cat-gear-btn" id="manage-categories" title="{{ t('Manage Categories') }}" aria-label="{{ t('Manage Categories') }}"><i data-lucide="settings-2"></i></button>{% endif %}</div>{% if categories|length > 8 %}<input class="form-control form-control-sm category-search" id="category-filter-search" type="search" placeholder="{{ t('Type to filter categories…') }}" aria-label="{{ t('Filter categories') }}">{% endif %}</div><select class="form-select" name="status" aria-label="Stock status"><option value="">{{ t('All Stock Status') }}</option>{% for id,label in [('in','In Stock'),('low','Low Stock'),('out','Out of Stock')] %}<option value="{{ id }}" {{ 'selected' if request.args.get('status')==id else '' }}>{{ t(label) }}</option>{% endfor %}</select><select class="form-select" name="supplier_id" aria-label="Supplier"><option value="">{{ t('All Suppliers') }}</option>{% for s in suppliers %}<option value="{{ s.id }}" {{ 'selected' if request.args.get('supplier_id')==s.id|string else '' }}>{{ s.name }}</option>{% endfor %}</select><a class="btn btn-light" href="{{ request.path }}">{{ t('Reset') }}</a><button class="btn btn-primary"><i data-lucide="search"></i>{{ t('Apply Filters') }}</button></form>
