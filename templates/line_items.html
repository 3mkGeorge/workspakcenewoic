<div class="line-search"><i data-lucide="scan-barcode"></i><input class="form-control" id="product-finder" list="product-options" placeholder='{{ t("Search a product, enter SKU, or scan barcode and press Enter") }}' aria-label='{{ t("Find product") }}'><datalist id="product-options">{% for p in products %}<option value="{{ p.sku }}">{{ p.name }} · {{ p.barcode or '' }}</option>{% endfor %}</datalist></div>
<div class="table-responsive"><table class="table line-table"><thead><tr><th>{{ t('Product') }}</th><th>{{ t('Quantity') }}</th><th>{{ 'Unit cost' if purchase else t('Price') }} ({{ config.currency }})</th><th>{{ t('Total') }}</th><th></th></tr></thead><tbody id="line-items">{% if sale %}{% for item in sale.items %}<tr><td><select name="product_id" class="form-select line-product" aria-label="{{ t('Product') }}" required>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.price }}" data-cost="{{ p.cost }}" data-sku="{{ p.sku }}" data-barcode="{{ p.barcode or '' }}" {{ 'selected' if p.id==item.product_id else '' }}>{{ p.name }} · {{ p.sku }} ({{ p.stock }} available)</option>{% endfor %}</select></td><td><input name="quantity" class="form-control line-quantity" aria-label="{{ t('Quantity') }}" type="number" min="1" max="1000000" value="{{ item.quantity }}" required></td><td><span class="unit-price"></span></td><td class="line-total"></td><td><button class="icon-button remove-line" type="button" aria-label="Remove item"><i data-lucide="trash-2"></i></button></td></tr>{% endfor %}{% endif %}</tbody></table></div><button class="btn btn-light" type="button" id="add-line"><i data-lucide="plus"></i>{{ t('Add Item') }}</button>
<template id="line-template"><tr><td><select name="product_id" class="form-select line-product" aria-label="{{ t('Product') }}" required><option value="">{{ t("Choose a product") }}</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.price }}" data-cost="{{ p.cost }}" data-sku="{{ p.sku }}" data-barcode="{{ p.barcode or '' }}">{{ p.name }} · {{ p.sku }} ({{ p.stock }} available)</option>{% endfor %}</select></td><td><input name="quantity" class="form-control line-quantity" aria-label="{{ t('Quantity') }}" type="number" min="1" max="1000000" value="1" required></td><td>{% if purchase %}<input name="unit_cost" class="form-control line-cost" aria-label="{{ t('Unit Cost') }}" type="number" min="0" max="1000000000" step="0.01" value="0" required>{% else %}<span class="unit-price"></span>{% endif %}</td><td class="line-total"></td><td><button class="icon-button remove-line" type="button" aria-label="Remove item"><i data-lucide="trash-2"></i></button></td></tr></template>
